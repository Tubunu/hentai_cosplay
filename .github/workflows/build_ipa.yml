name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases (true/false)'
        required: false
        default: 'false'
        type: boolean
      release_tag:
        description: 'Release 标签名 (如 v1.0.10)'
        required: false
        default: 'v1.0.14'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14 # Apple Silicon M2 runner
    timeout-minutes: 45

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 编译与集成 Libbox.xcframework 核心
        env:
          GOTOOLCHAIN: auto
        run: |
          set -e
          echo "=== 1. 安装 Gomobile 和 Gobind ==="
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export GOPATH=$(go env GOPATH)
          export PATH="$GOPATH/bin:$PATH"
          gomobile init

          echo "=== 2. 获取 Sing-box 核心源码 ==="
          git clone --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          echo "=== 2.5 注入内嵌命令服务适配层 ==="
          cat << 'EOF' > /tmp/sing-box/experimental/libbox/standalone.go
package libbox

type InProcessPlatformInterface struct{}

func (i *InProcessPlatformInterface) LocalDNSTransport() LocalDNSTransport { return nil }
func (i *InProcessPlatformInterface) UsePlatformAutoDetectInterfaceControl() bool { return false }
func (i *InProcessPlatformInterface) AutoDetectInterfaceControl(fd int32) error { return nil }
func (i *InProcessPlatformInterface) OpenTun(options TunOptions) (int32, error) { return -1, nil }
func (i *InProcessPlatformInterface) UseProcFS() bool { return false }
func (i *InProcessPlatformInterface) FindConnectionOwner(ipProtocol int32, sourceAddress string, sourcePort int32, destinationAddress string, destinationPort int32) (*ConnectionOwner, error) { return nil, nil }
func (i *InProcessPlatformInterface) StartDefaultInterfaceMonitor(listener InterfaceUpdateListener) error { return nil }
func (i *InProcessPlatformInterface) CloseDefaultInterfaceMonitor(listener InterfaceUpdateListener) error { return nil }
func (i *InProcessPlatformInterface) GetInterfaces() (NetworkInterfaceIterator, error) { return nil, nil }
func (i *InProcessPlatformInterface) UnderNetworkExtension() bool { return false }
func (i *InProcessPlatformInterface) IncludeAllNetworks() bool { return false }
func (i *InProcessPlatformInterface) ReadWIFIState() *WIFIState { return nil }
func (i *InProcessPlatformInterface) ClearDNSCache() {}
func (i *InProcessPlatformInterface) SendNotification(notification *Notification) error { return nil }
func (i *InProcessPlatformInterface) CancelNotification(identifier string, typeID int32) error { return nil }
func (i *InProcessPlatformInterface) StartNeighborMonitor(listener NeighborUpdateListener) error { return nil }
func (i *InProcessPlatformInterface) CloseNeighborMonitor(listener NeighborUpdateListener) error { return nil }
func (i *InProcessPlatformInterface) RegisterMyInterface(name string) {}
func (i *InProcessPlatformInterface) UsePlatformShell() bool { return false }
func (i *InProcessPlatformInterface) CheckPlatformShell() error { return nil }
func (i *InProcessPlatformInterface) OpenShellSession(user *PlatformUser, command string, environ StringIterator, term string, rows int32, cols int32) (ShellSession, error) { return nil, nil }
func (i *InProcessPlatformInterface) LookupUser(username string) (*PlatformUser, error) { return nil, nil }
func (i *InProcessPlatformInterface) LookupSFTPServer() (string, error) { return "", nil }
func (i *InProcessPlatformInterface) ReadSystemSSHHostKey() (string, error) { return "", nil }
func (i *InProcessPlatformInterface) TailscaleHostname() string { return "" }
func (i *InProcessPlatformInterface) UsePlatformBridge() bool { return false }
func (i *InProcessPlatformInterface) CreateBridge(options *BridgeOptions) (BridgeSession, error) { return nil, nil }
func (i *InProcessPlatformInterface) UsePlatformAutoRedirect() bool { return false }
func (i *InProcessPlatformInterface) CreateAutoRedirect(options []byte, handler AutoRedirectHandler) (AutoRedirectSession, error) { return nil, nil }

type InProcessCommandHandler struct{}

func (h *InProcessCommandHandler) ServiceStop() error { return nil }
func (h *InProcessCommandHandler) ServiceReload() error { return nil }
func (h *InProcessCommandHandler) GetSystemProxyStatus() (*SystemProxyStatus, error) {
	return &SystemProxyStatus{Available: false, Enabled: false}, nil
}
func (h *InProcessCommandHandler) SetSystemProxyEnabled(enabled bool) error { return nil }
func (h *InProcessCommandHandler) TriggerNativeCrash() error { return nil }
func (h *InProcessCommandHandler) WriteDebugMessage(message string) {}
func (h *InProcessCommandHandler) ConnectSSHAgent() (int32, error) { return -1, nil }

func NewInProcessCommandServer() (*CommandServer, error) {
	return NewCommandServer(&InProcessCommandHandler{}, &InProcessPlatformInterface{})
}
EOF

          echo "=== 3. 编译 Libbox iOS (arm64) 原生动态框架 ==="
          go run ./cmd/internal/build_libbox -target apple -platform ios

          echo "=== 4. 规范化 Framework 结构与 Info.plist ==="
          FW_DIR="/tmp/sing-box/Libbox.xcframework"
          for fw in $(find "$FW_DIR" -name "*.framework" -type d); do
            if [ -d "$fw/Versions/A" ]; then
              tmp=$(mktemp -d /tmp/libbox-fw-XXXXXX)
              cp "$fw/Versions/A/Libbox" "$tmp/Libbox" || true
              [ -f "$fw/Versions/A/Resources/Info.plist" ] && cp "$fw/Versions/A/Resources/Info.plist" "$tmp/Info.plist"
              [ -d "$fw/Versions/A/Headers" ] && cp -R "$fw/Versions/A/Headers" "$tmp/Headers"
              [ -d "$fw/Versions/A/Modules" ] && cp -R "$fw/Versions/A/Modules" "$tmp/Modules"
              rm -rf "$fw"
              mv "$tmp" "$fw"
            fi
            plist="$fw/Info.plist"
            if [ ! -s "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string en" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string io.nekohasekai.libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleName string Libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string FMWK" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist" 2>/dev/null || true
            fi
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$plist" 2>/dev/null || true
          done

          echo "=== 5. 集成到 iOS 工程 ==="
          mkdir -p "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox"
          cp -R "$FW_DIR" "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox/"
          ls -la "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox/Libbox.xcframework"

      - name: 环境诊断
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== Xcode Version ==="
          xcodebuild -version

      - name: 获取 Flutter 依赖包
        working-directory: hentai_cosplay_downloader
        run: flutter pub get

      - name: 编译构建 iOS Release App (无签名)
        working-directory: hentai_cosplay_downloader
        run: |
          flutter build ios --release --no-codesign

      - name: 打包为自签名/侧载通用的 .ipa 文件
        working-directory: hentai_cosplay_downloader
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -RL build/ios/iphoneos/Runner.app Payload/
          find Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 Payload/Runner.app
          zip -r -q HentaiCosplay-iOS-Release.ipa Payload
          echo "=== 打包完成，文件详情 ==="
          ls -lh HentaiCosplay-iOS-Release.ipa

      - name: 上传构建产物 (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HentaiCosplay-iOS-Release-IPA
          path: hentai_cosplay_downloader/HentaiCosplay-iOS-Release.ipa
          retention-days: 30

      - name: 发布至 GitHub Release (可选)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Hentai Cosplay Downloader iOS ${{ inputs.release_tag || github.ref_name }}
          files: hentai_cosplay_downloader/HentaiCosplay-iOS-Release.ipa
          body: |
            ## 📱 iOS 安装包构建产物
            - **文件**: `HentaiCosplay-iOS-Release.ipa`
            - **构建方式**: GitHub Actions macOS-14 云编译
            - **适用设备**: iOS 15.0+ 设备
            - **安装建议**: 可通过 **TrollStore（巨魔商店）**、**AltStore**、**Sideloadly**、**爱思助手** 或自签名证书直接导入安装！
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
