name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases (true/false)'
        required: false
        default: 'false'
        type: boolean
      release_tag:
        description: 'Release 标签名 (如 v1.0.10)'
        required: false
        default: 'v1.0.10'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14 # Apple Silicon M2 runner
    timeout-minutes: 45

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 环境诊断
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== Xcode Version ==="
          xcodebuild -version

      - name: 获取 Flutter 依赖包
        working-directory: hentai_cosplay_downloader
        run: flutter pub get

      - name: 编译构建 iOS Release App (无签名)
        working-directory: hentai_cosplay_downloader
        run: |
          flutter build ios --release --no-codesign

      - name: 打包为自签名/侧载通用的 .ipa 文件
        working-directory: hentai_cosplay_downloader
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 HentaiCosplay-iOS-Release.ipa Payload
          echo "=== 打包完成，文件详情 ==="
          ls -lh HentaiCosplay-iOS-Release.ipa

      - name: 上传构建产物 (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HentaiCosplay-iOS-Release-IPA
          path: hentai_cosplay_downloader/HentaiCosplay-iOS-Release.ipa
          retention-days: 30

      - name: 发布至 GitHub Release (可选)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Hentai Cosplay Downloader iOS ${{ inputs.release_tag || github.ref_name }}
          files: hentai_cosplay_downloader/HentaiCosplay-iOS-Release.ipa
          body: |
            ## 📱 iOS 安装包构建产物
            - **文件**: `HentaiCosplay-iOS-Release.ipa`
            - **构建方式**: GitHub Actions macOS-14 云编译
            - **适用设备**: iOS 15.0+ 设备
            - **安装建议**: 可通过 **TrollStore（巨魔商店）**、**AltStore**、**Sideloadly**、**爱思助手** 或自签名证书直接导入安装！
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
