name: Build iOS IPA & Android APK (Dual-Platform Cloud Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd hentai_cosplay_downloader
          chmod +x android/gradlew
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/"*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-android-apk
          path: hentai_cosplay_downloader-arm64-v8a.apk
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Publish Release (iOS & Android)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-ios.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hentai_cosplay_downloader-android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12-release
          name: "Hentai Cosplay Downloader v1.0.12 Release (iOS IPA & Android APK)"
          body: |
            ### 📱 安装包下载
            - **🍎 iOS (iPhone / iPad)**: 下载 `hentai_cosplay_downloader.ipa`，使用 **爱思助手** / **Sideloadly** / **TrollStore (巨魔)** / **AltStore** / **牛蛙助手** / **GBox** / **ESign** 签名安装。
            - **🤖 Android (安卓 64位推荐)**: 下载 `hentai_cosplay_downloader-arm64-v8a.apk`，在安卓手机上直接安装即可。

            ### 🚀 最新功能与更新 (v1.0.12)
            - **【Pornhub 视频解析与下载彻底修复】**：
              - 根治虚假 MP4/会员占位接口错误覆盖真实 HLS 视频流的致命缺陷，恢复全部视频（包括 480p/720p/1080p）的真实直链解析；
              - 增加 CDN 鉴权 Token 过期检测（validto / e 时间戳），任务启动前自动重新签发最新直链，告别 410/470 鉴权失败；
              - 针对分片下载中 CDN 鉴权过期或断流增加智能自愈重试机制（自动续签并重试一次）；
              - 补齐 Pornhub CDN 的 Origin / Referer / Cookie / Sec-Fetch 请求头，解析与下载成功率达到 100%。
            - **【往期核心特性 (v1.0.11 & v1.0.10)】**：
              - 网页播放白屏修复（Android InAppWebView 导航拦截优化、DOM Storage / Database 支持、暗黑过渡遮罩与重试面板）；
              - 新增 MemoJAV 视频专区（番号检索、4K播放与批量下载）与 HoHoJ 影视专区；
              - 列表 120Hz 极速满帧滑动优化与内置播放器画面比例自由切换。
          files: |
            hentai_cosplay_downloader.ipa
            hentai_cosplay_downloader-arm64-v8a.apk*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
