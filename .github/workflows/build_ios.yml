name: Build iOS IPA (Free No-Mac Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd hentai_cosplay_downloader/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y -q hentai_cosplay_downloader.ipa Payload
          cp hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7
