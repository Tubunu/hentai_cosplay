name: Build iOS IPA & Android APK (Dual-Platform Cloud Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build & Integrate Libbox.xcframework for iOS
        env:
          GOTOOLCHAIN: auto
        run: |
          set -e
          echo "=== 1. Install Gomobile and Gobind ==="
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export GOPATH=$(go env GOPATH)
          export PATH="$GOPATH/bin:$PATH"
          gomobile init

          echo "=== 2. Clone Sing-box Core ==="
          git clone --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          cp "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox/standalone.go" /tmp/sing-box/experimental/libbox/

          echo "=== 3. Compile Libbox for iOS (arm64) ==="
          go run ./cmd/internal/build_libbox -target apple -platform ios

          echo "=== 4. Flatten & Validate Framework ==="
          FW_DIR="/tmp/sing-box/Libbox.xcframework"
          for fw in $(find "$FW_DIR" -name "*.framework" -type d); do
            if [ -d "$fw/Versions/A" ]; then
              tmp=$(mktemp -d /tmp/libbox-fw-XXXXXX)
              cp "$fw/Versions/A/Libbox" "$tmp/Libbox" || true
              [ -f "$fw/Versions/A/Resources/Info.plist" ] && cp "$fw/Versions/A/Resources/Info.plist" "$tmp/Info.plist"
              [ -d "$fw/Versions/A/Headers" ] && cp -R "$fw/Versions/A/Headers" "$tmp/Headers"
              [ -d "$fw/Versions/A/Modules" ] && cp -R "$fw/Versions/A/Modules" "$tmp/Modules"
              rm -rf "$fw"
              mv "$tmp" "$fw"
            fi
            plist="$fw/Info.plist"
            if [ ! -s "$plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string en" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string io.nekohasekai.libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleName string Libbox" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string FMWK" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist" 2>/dev/null || true
            fi
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$plist" 2>/dev/null || true
          done

          echo "=== 5. Move Framework to Flutter iOS Project ==="
          mkdir -p "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox"
          cp -R "$FW_DIR" "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox/"
          ls -la "$GITHUB_WORKSPACE/hentai_cosplay_downloader/ios/Libbox/Libbox.xcframework"

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd hentai_cosplay_downloader
          chmod +x android/gradlew
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/"*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-android-apk
          path: hentai_cosplay_downloader-arm64-v8a.apk
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Publish Release (iOS & Android)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-ios.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hentai_cosplay_downloader-android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14-release
          name: "Hentai Cosplay Downloader v1.0.14 Release (iOS IPA & Android APK)"
          body: |
            ### 📱 安装包下载
            - **🍎 iOS (iPhone / iPad)**: 下载 `hentai_cosplay_downloader.ipa`，使用 **爱思助手** / **Sideloadly** / **TrollStore (巨魔)** / **AltStore** / **牛蛙助手** / **GBox** / **ESign** 签名安装。
            - **🤖 Android (安卓 64位推荐)**: 下载 `hentai_cosplay_downloader-arm64-v8a.apk`，在安卓手机上直接安装即可。

            ### 🚀 最新功能与更新 (v1.0.14)
            - **【全内置 Libbox 代理引擎与智能分流网关】**：
              - 内置嵌入式 Sing-box / Libbox 高性能代理引擎，支持 VLESS、VMess、Trojan、Shadowsocks、Hysteria 2、TUIC 现代主流协议；
              - 智能分流网关与独立网站代理开关：支持为各个海外漫画/视频站点（Pornhub、Jable、Iwara 等）单独控制是否走代理，国内直连站点自动旁路；
              - 彻底修复 Android 平台 Linux 内核 Socket 绑定权限限制与 DNS 路由解析，全面杜绝启动闪退与空指针异常。
            - **【ChromeGo 节点提取器】**：
              - 聚合抓取海量免费节点并支持并发测速、去重、一码全入二维码导入与局域网 Wi-Fi 订阅共享。
            - **【稳定性与性能提升】**：
              - 优化核心网络包与依赖环境，增强多线程下载稳定性。
          files: |
            hentai_cosplay_downloader.ipa
            hentai_cosplay_downloader-arm64-v8a.apk*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
