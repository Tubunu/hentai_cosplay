name: Build iOS IPA & Android APK (Dual-Platform Cloud Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd hentai_cosplay_downloader
          chmod +x android/gradlew
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/"*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-android-apk
          path: hentai_cosplay_downloader-arm64-v8a.apk
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Publish Release (iOS & Android)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-ios.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hentai_cosplay_downloader-android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11-release
          name: "Hentai Cosplay Downloader v1.0.11 Release (iOS IPA & Android APK)"
          body: |
            ### 📱 安装包下载
            - **🍎 iOS (iPhone / iPad)**: 下载 `hentai_cosplay_downloader.ipa`，使用 **爱思助手** / **Sideloadly** / **TrollStore (巨魔)** / **AltStore** / **牛蛙助手** / **GBox** / **ESign** 签名安装。
            - **🤖 Android (安卓 64位推荐)**: 下载 `hentai_cosplay_downloader-arm64-v8a.apk`，在安卓手机上直接安装即可。

            ### 🚀 最新功能与更新 (v1.0.11)
            - **【网页播放白屏彻底修复】**：
              - 根治各专区视频详情点击“网页播放”白屏问题：重构 Android InAppWebView 导航拦截逻辑，杜绝主框架请求被底层自动取消；
              - 开启 HTML5 现代播放器必需的 `DOM Storage` (localStorage) 与 `Database` 支持，彻底杜绝播放器内核 JS 报错闪退；
              - 全面加固 SSL 证书信任握手穿透与混合内容放行，保障海外视频源与代理环境下顺畅稳定加载；
              - 新增暗黑过渡加载遮罩（告别刺眼白屏闪烁）与网页加载异常重试面板（支持一键重新加载与复制链接）；
              - 顶部导航栏新增快捷“复制网页链接”按钮，方便一键呼出系统外部浏览器播放。
            - **【网络与代理兼容性优化】**：
              - 修复清除代理配置时的 WebView 原生代理残留问题，规范 SOCKS5 代理协议注入格式。
            - **【往期核心特性 (v1.0.10)】**：
              - 新增 MemoJAV 视频专区（全网最佳推荐、番号检索、4K播放与批量下载）；
              - 新增 HoHoJ 影视专区（热门/最新/高赞榜单、多维标签、海外 CDN 证书穿透）；
              - 列表 120Hz 极速满帧滑动优化（静态微质感占位符 0 Ticker、50ms 手势防误触、RepaintBoundary 独立图层隔离、600px 视口预渲染）；
              - 内置播放器画面比例自由切换（自适应 Fit、居中填充 Cover、全屏拉伸 Fill，双击快捷循环切换）。
          files: |
            hentai_cosplay_downloader.ipa
            hentai_cosplay_downloader-arm64-v8a.apk*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
