name: Build iOS IPA & Android APK (Dual-Platform Cloud Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd hentai_cosplay_downloader
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/"*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-android-apk
          path: hentai_cosplay_downloader-arm64-v8a.apk
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Publish Release (iOS & Android)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-ios.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hentai_cosplay_downloader-android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10-release
          name: "Hentai Cosplay Downloader v1.0.10 Release (iOS IPA & Android APK)"
          body: |
            ### 📱 安装包下载
            - **🍎 iOS (iPhone / iPad)**: 下载 `hentai_cosplay_downloader.ipa`，使用 **爱思助手** / **Sideloadly** / **TrollStore (巨魔)** / **AltStore** / **牛蛙助手** / **GBox** / **ESign** 签名安装。
            - **🤖 Android (安卓 64位推荐)**: 下载 `hentai_cosplay_downloader-arm64-v8a.apk`，在安卓手机上直接安装即可。

            ### 🚀 最新功能与更新 (v1.0.10)
            - **【新增 MemoJAV 视频专区】**：
              - 完整支持全网最佳推荐（支持任意选择最佳历史页码）、最新收录与番号/关键词极速检索；
              - 自动提取番号、片商（FALENO、S1、Moodyz 等）、主演女优标签与高清封面；
              - 支持原生 4K/1080P 在线播放、断点续传下载与多选批量下载任务调度。
            - **【新增 HoHoJ 影视专区】**：
              - 完整收录热门推荐、最新发布、最多观看、最多赞榜单与全站搜索；
              - 精准覆盖有码、无码、中文字幕、欧美分类，支持播放量与热度多维度呈现；
              - 全面加固海外 CDN 图床 SSL 证书穿透与等比安全解码，封面加载丝滑可靠。
            - **【列表极致流畅滑动深度优化（120Hz 满帧高刷）】**：
              - 采用纯静态微质感无损占位符，彻底消除滑动时数十个转圈动画导致的 Ticker 线程争抢；
              - 实施 50ms 手势防抖与点击回弹分离，快划列表绝不误触发卡片动画；
              - 卡片全量启用 RepaintBoundary 独立光栅化栅格图层隔离，单张卡片刷新不重绘整屏；
              - 视口预渲染深度扩展至 600px，进屏即展示，杜绝掉帧与瞬时卡顿。
            - **【内置播放器全尺寸与比例自由切换】**：
              - 新增视频画面比例控制：支持原始自适应（Fit）、居中等比裁剪填充（Cover）、全屏填满（Fill）；
              - 双击手势快速循环切换画面比例，记忆用户偏好，杜绝黑边与变形困扰。
            - **【跨站点统一搜索中继服务】**：
              - 支持番号、女优、主题全网多站点一键中继快捷检索与快速切换。
          files: |
            hentai_cosplay_downloader.ipa
            hentai_cosplay_downloader-arm64-v8a.apk*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
