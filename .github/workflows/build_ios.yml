name: Build iOS IPA & Android APK (Dual-Platform Cloud Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd hentai_cosplay_downloader
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/hentai_cosplay_downloader-arm64-v8a.apk"
          ls -lh "$GITHUB_WORKSPACE/"*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-android-apk
          path: hentai_cosplay_downloader-arm64-v8a.apk
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Publish Release (iOS & Android)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-ios.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hentai_cosplay_downloader-android-apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3-release
          name: "Hentai Cosplay Downloader v1.0.3 Release (iOS IPA & Android APK)"
          body: |
            ### 📱 安装包下载
            - **🍎 iOS (iPhone / iPad)**: 下载 `hentai_cosplay_downloader.ipa`，使用 **爱思助手** / **Sideloadly** / **TrollStore** / **AltStore** / **牛蛙助手** 签名安装。
            - **🤖 Android (安卓 64位推荐)**: 下载 `hentai_cosplay_downloader-arm64-v8a.apk` (体积仅 ~65MB)，在安卓手机上直接安装即可。

            ### 🚀 最新功能与修复更新 (v1.0.3)
            - **全站点真·全库随机漫游**：支持 16 个站点（9个图集站 + 7个视频站）全库随机抽样探索，进入详情页后可无缝连续切换下一个随机资源。
            - **Kuraa 智能多源随机**：精准限定在「二次元」(2.6万插画)、「秀人」(2000套图)、「达盖尔」(7700套图) 三大核心分类中真随机抽样。
            - **本地图库全来源筛选**：本地资源支持 10 种来源全量过滤（HC、ExHentai、MZT、MissKon、PixiBB、CosplayTele、NuCosplay、Coomer、Kuraa），并提供实时计数与自适应悬浮「返回最顶部」。
            - **ExHentai / 810114 智能来源校正**：彻底解决镜像源下载在本地被误标为 HC 的历史问题。
            - **画中画（PiP）后台保活**：支持 iOS 原生画中画浮窗保活，切到后台持续满速下载。
            - **全量多媒体播放与下载引擎**：支持 HLS AES-128 切片异步解密、多线程并发加速、断点续传与大图包分页解析。
          files: |
            hentai_cosplay_downloader.ipa
            hentai_cosplay_downloader-arm64-v8a.apk*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
