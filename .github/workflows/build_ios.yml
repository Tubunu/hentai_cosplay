name: Build iOS IPA (Free No-Mac Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd hentai_cosplay_downloader
          flutter pub get

      - name: Build iOS Release App
        run: |
          cd hentai_cosplay_downloader
          flutter build ios --release --no-codesign

      - name: Package Clean Standard IPA
        run: |
          cd hentai_cosplay_downloader
          rm -rf ipa_staging
          mkdir -p ipa_staging/Payload
          cp -RL build/ios/iphoneos/Runner.app ipa_staging/Payload/
          # Remove any dummy code signature or metadata that might confuse third-party resigners
          find ipa_staging/Payload -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
          find ipa_staging/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find ipa_staging/Payload -name ".DS_Store" -delete 2>/dev/null || true
          chmod -R 755 ipa_staging/Payload/Runner.app
          cd ipa_staging
          zip -r -q hentai_cosplay_downloader.ipa Payload
          mv hentai_cosplay_downloader.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/hentai_cosplay_downloader.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hentai_cosplay_downloader-ios-ipa
          path: hentai_cosplay_downloader.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Create or Update GitHub Release (Direct IPA Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-ios
          name: "Hentai Cosplay Downloader iOS Release"
          body: |
            ### 📱 iOS 免费直装版本（包含高清 App 图标与纯净动态库）
            - 直接下载下方的 `hentai_cosplay_downloader.ipa` 文件。
            - 打开 **Sideloadly** 拖入安装到 iPhone。
          files: hentai_cosplay_downloader.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
