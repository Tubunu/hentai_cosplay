name: mzt_downloader
description: "A modern iOS Apple Music style image browser and multi-threaded downloader for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  share_plus: ^10.1.4
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.2.0+3
  pool: ^1.5.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
